; Inventory Reforged for SkyUI. With MCM Helper these are the starting numbers of the menu in the journal
; and the menu keeps what you set in Data/MCM/Settings/InventoryReforged.ini, which wins over this file.
; What you picked in the installer lies in small files of SKSE/Plugins/InventoryReforged/ over this one, it goes
; into the menu's file at the start of a game and the menu shows it from there

[Panel]
; 0 leaves the item menus of SkyUI as they are and shows the pieces of hidden slots while it stays 0,
; they are remembered and hide again with 1
bEnabled = 1
; the sliders button in the bottom bar of the item menus, 0 hides it and everything stays set here
bLookButton = 1
; with mods that keep the world running under menus, like Skyrim Souls RE, the camera stays still while the
; inventory is open. 0 lets the pointer at an edge of the screen or a stick turn it as that mod does
bStillCamera = 1
; in a trade with a follower (and any inventory a mod opens with Actor.OpenInventory) the panel shows the follower,
; what goes into a slot goes on them. 0 leaves such a trade as a plain container
bFollowers = 1
; what you put on or take off a follower in the panel stays so: the game doesn't swap it for gear it thinks is better,
; in a fight or out of it. A mod that changes a piece back 3 times within 10 minutes gets that piece. 0 lets the game
; dress followers its own way
bKeepChoices = 1
; tabs over the doll: you and each follower near you. A click in the inventory opens that follower's trade, in a
; trade another follower's or your own inventory. 1 shows them
bCompanionTabs = 0
; SkyUI's magic menu gets the character between the slots of the two hands and the voice. 0 leaves it as it is
bMagicMenu = 1
; the character and the slots at the crafting stations that make or better gear, a piece tried on there for show by
; the menu of its row. 0 leaves those menus as they are
bCraftingMenu = 1
; the panel of slots and the character beside the list in percent of its full width, 60 to 100. It narrows from
; both sides and the character stays in the middle, for a UI skin or a screen where the slots lay over the rows
iPanelSize = 100
; moves a narrowed panel right in percent of its full width, below zero left, -20 to 20. A column never goes past
; its place at full width, so a full panel stays put
iPanelShift = 0

[Doll]
; the 3D character between the columns of slots
bShow = 1
; 0 standing calm and straight whatever you do when the menu opens, 1 the pose of that moment (in third person,
; in first person the character stands either way)
iPose = 0
; degrees the character turns for a pixel of a drag across it
fTurnSpeed = 0.5
; the character plays what a mod of equipping animations plays on you as a piece goes on or off, Immersive Equipping
; Animations and the like. Under a paused menu the world plays it again once the menu closes
bEquipMotion = 1
; the size of the character in percent of the size that fits its room, 60 to 140
iScale = 100
; how far the character stands right of the middle of its room in percent of the room's width, -40 to 40
iShiftRight = 0
; how far the character stands above the middle of its room in percent of the room's height, -40 to 40
iShiftUp = 0

[Slots]
; 3D models of what you wear, 0 flat signs
bModels = 1
; pictures of the items in the rows of the inventory, made once while a save loads, 0 flat signs
bRowModels = 1
; armor, jewelry and cloaks shown as they sit on the body, 0 their model on the ground
bWornLook = 1
; the eye in the corner of a slot that hides its piece on the character
bHideIcons = 1
; a click on a slot opens the item window beside it
bPopup = 1
; a double click on a slot takes its piece off
bDoubleClickTakesOff = 1
; rows of the list can be dragged onto slots and the character
bDragAndDrop = 1
; a slot with several pieces pulls out a strip of small slots, one for every piece
bPieceStrips = 1
; the slots of the panel, 0 takes a slot off the panel. What you wear there stays worn
bShowRight = 1
bShowLeft = 1
bShowAmmo = 1
bShowAmulet = 1
bShowRing = 1
bShowHead = 1
bShowBody = 1
bShowHands = 1
bShowFeet = 1
bShowOther = 1

[List]
; height of the rows of the item lists in percent, 100 to 200, the pictures grow with them
iRowHeight = 100
; arrows that compare an item with what you wear in its place
bArrows = 1
; a grey = for an item that gives the same, off for a cleaner list
bEqualSign = 0
; the sign of its slot on a row you could wear, in the column where a worn row has its mark
bBadges = 0
; a strip under weapons and apparel: one handed, two handed, light, heavy, head and so on
bSubcategories = 1
; a right click on a row opens its menu: equip, use, drop, take, store, buy, sell, some or all of a stack
bRowMenu = 1
; this key moves the whole stack of the row under the pointer in a container or a shop, scan code, 45 is X, 0 for none
iStackKey = 45
; the name column sorts by what you got last
bLastAdded = 1
; the weight column sorts by whole stacks
bStackWeight = 1
; a small dot on what you got since you last closed the inventory, on its row and its subcategory
bNewMarks = 1
; a small sign after the name of what a quest wants: gold while it's needed, dim gold for a quest not begun, grey
; once the quest is done
bQuestMarks = 1
; stolen copies of an item get a row of their own beside yours in your inventory and in chests, a move takes just the
; copies of its row. Not what a merchant or a follower carries. Game 1.6 and later
bStolenApart = 1
; junk marks: the menu of a row or the junk key marks an item as junk, chests store and shops buy all junk at once.
; Never what you wear, a favorite or what a quest wants
bJunk = 1
; this key marks the row under the pointer as junk or not, scan code, 36 is J, 0 for none
iJunkKey = 36
; in a chest or a shop the weight of a row is red when taking it would slow you, a subcategory tells what it weighs
bWeightWarnings = 1

[Window]
; the item window with its card in percent, 70 to 160. At 100 it takes about half the list and never less than
; four tenths of the screen's height
iSize = 100
; the words of the item window in percent of their own size, 80 to 200: the item's name, the card's effects,
; enchantments and descriptions, the combat numbers, and the small lines (the kind under the name, what it's made of,
; quest, body slots, how many you have, silver, the mod, stolen)
iNameText = 100
iWordsText = 100
iNumbersText = 100
iQuietText = 100
; all the words of the game's own card, 80 to 200: in a chest or a shop, and in the inventory with the card left
; in the UI's place, with the numbers the mod puts in it
iCardText = 100
; how the item window comes up over a row: 0 at once, 1 once the pointer rests on the row a moment, 2 the UI's
; own card, no window over the rows and the card and model of a row left where SkyUI or the UI skin puts them, as
; without this mod. A click on a slot, a question of how many and Details in a row's menu still bring it up.
; Up to 1.5.0 this was iShow, where 2 was "never": an iShow left in a file without iPopUp is read so, never as 1
iPopUp = 0
; swing time, DPS, DPM, reach and stagger of weapons, the share of a hit armor stops
bStats = 1
; the tab at the feet of your character that pulls your numbers up over it
bHeroStats = 1
; a small grey line in the window of a piece you wear with the body slots it takes, like Slots 32, 46
bSlotNumbers = 0
; quiet lines in the window: the kind, what it's made of, how many you have, silver, the plugin it comes from
bQuietTags = 1
; the quiet line From <plugin> of an item a mod adds, 0 hides just that line
bModOrigin = 1
; the line of the window that says what a quest wants with the item and whether that quest is done
bQuestLine = 1
; 1 leaves a skin's own item card where and how the skin draws it, with its art, its kind line and its effects,
; and the window holds the model and the numbers. For a skin whose card stands apart from the panel. With Norden
; UI's own layouts the card lands on the character or under the window, so 0 suits most skins. Comes with the next
; opening of the menu
bLeaveCard = 0

[Numbers]
; the lines of the combat numbers one by one, 0 hides just that line: swing or draw time, damage a second and a
; minute, reach, stagger, crit damage, the share of a hit a piece stops, the whole set, effective health, armor per
; weight
bSwing = 1
bDPS = 1
bDPM = 1
bReach = 1
bStagger = 1
bCritDamage = 1
bStops = 1
bWholeSet = 1
bEffectiveHealth = 1
bArmorPerWeight = 1

[Lines]
; the small lines one by one, 0 hides just that line: the kind under the name, how many you have in a chest or a
; shop, silver, stolen
bKind = 1
bHave = 1
bSilver = 1
bStolen = 1
; what the item is made of, a small list in the top left corner of its picture in the window: 0 nothing, 1 the
; material its keywords name, 2 every part of the recipe that makes it with how many, the material when no recipe does
iMadeOf = 2

[Inspect]
; the item zoom key opens the full screen inspect view of the panel
bOnZoomKey = 1

[Look]
; the colour of what is picked, lit or counted: frames, headings, numbers, tabs. A colour 0xRRGGBB written as
; a decimal number, 14069864 is the gold the mod comes with
iAccentColor = 14069864
; the colour of names and signs at rest, 15130824 is the pale parchment the mod comes with
iTextColor = 15130824

[Debug]
; writes the pose of the live player into SKSE/InventoryReforged-pose-male.txt or -female.txt on every menu open
bDumpPose = 0
